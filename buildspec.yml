version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "774118824725"
    REPOSITORY_NAME: "website"
    CONTAINER_NAME: "website"
    CLUSTER_NAME: "website-cluster"
    AWS_DEFAULT_REGION: "ap-south-1"
    IMAGE_TAG: "latest"

phases:

  pre_build:
    commands:
      - echo "=== AWS IDENTITY ==="
      - aws sts get-caller-identity

      - echo "=== REGION ==="
      - echo $AWS_DEFAULT_REGION

      - echo "=== ACCOUNT ==="
      - echo $AWS_ACCOUNT_ID

      - echo "=== DOCKER VERSION ==="
      - docker --version

      - echo "=== DOCKER STATUS ==="
      - docker info

      - echo "=== SET REPOSITORY URI ==="
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPOSITORY_NAME
      - echo $REPOSITORY_URI

      - echo "=== ECR LOGIN ==="
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION > /tmp/ecr-password

      - echo "=== DOCKER LOGIN ==="
      - cat /tmp/ecr-password | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_NAME:$IMAGE_TAG .
      - docker tag $REPOSITORY_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo Writing image definitions file...
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - echo "=== CHECKING IMAGE DEFINITION FILE ==="
      - pwd
      - ls -la
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
